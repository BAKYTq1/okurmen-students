<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавление учеников</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- Token block -->
  <div class="container">
    <div class="token-block">
      <label for="tokenInput">🔑 API Token:</label>
      <input type="password" id="tokenInput" placeholder="Вставь токен сюда...">
      <button class="btn-primary" onclick="saveToken()" style="white-space:nowrap;">Сохранить</button>
      <div class="token-status" id="tokenStatus"></div>
    </div>

    <!-- Groups block -->
    <div class="groups-block">
      <h2>
        Группы
        <button class="btn-secondary" onclick="loadGroups()" id="reloadBtn"
                style="font-size:0.8rem; padding:4px 10px; margin-left:10px;">↻ Обновить</button>
      </h2>
      <div id="groupsGrid" class="groups-grid">
        <span class="groups-msg">Введи токен и нажми «Обновить»</span>
      </div>
    </div>

    <!-- Main form -->
    <div class="main-block">
      <h1>Добавление учеников</h1>
      <p class="hint">
        Загрузи PDF со списком имён или вставь список вручную (каждое имя с новой строки).<br>
        Выбери группу, проверь список и нажми «Добавить всех».
      </p>

      <div class="group-select-row">
        <label for="groupSelect">Группа:</label>
        <select id="groupSelect">
          <option value="">— сначала загрузи группы —</option>
        </select>
      </div>

      <div class="pdf-zone" id="dropZone">
        <label for="pdfInput">📄 Выбрать PDF</label>
        <input type="file" id="pdfInput" accept="application/pdf">
        <span class="pdf-filename" id="pdfFilename">Файл не выбран (можно перетащить PDF сюда)</span>
      </div>

      <textarea id="names" placeholder="Эрмырзаева Медина&#10;Абдрусулова Бактыгул&#10;Шарабидин Жалалидин&#10;..."></textarea>

      <div class="row">
        <button class="btn-primary" id="addBtn" onclick="addStudents()">Добавить всех</button>
        <button class="btn-secondary" onclick="document.getElementById('names').value=''; clearLog()">Очистить</button>
      </div>

      <div id="status"></div>
      <div id="log"></div>
    </div>
  </div>

  <!-- Group detail modal -->
  <div class="overlay" id="overlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Ученики группы</h3>
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <span class="groups-msg">Загружаю...</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
