<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавление учеников</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      color: #1a1a1a;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .hint {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .pdf-zone {
      border: 2px dashed #c7d2fe;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      background: #f5f6ff;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pdf-zone.drag {
      border-color: #4f46e5;
      background: #eef0ff;
    }
    .pdf-zone label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #4f46e5;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .pdf-zone label:hover { background: #4338ca; }
    .pdf-zone input[type="file"] { display: none; }
    .pdf-filename {
      font-size: 0.88rem;
      color: #4b5563;
    }
    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #4338ca;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #d1d5db;
    }
    #status {
      font-size: 0.95rem;
      margin-bottom: 12px;
      min-height: 1.4em;
    }
    #log {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      max-height: 320px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .ok { color: #15803d; }
    .err { color: #b91c1c; }
    .info { color: #1e40af; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Добавление учеников</h1>
    <p class="hint">
      Загрузи PDF со списком имён, либо вставь список вручную (каждое имя с новой строки).<br>
      После извлечения из PDF список появится в поле ниже — проверь и поправь его перед отправкой.
    </p>

    <div class="row" style="align-items:center; margin-bottom: 8px;">
      <label for="groupId" style="font-size:0.9rem; color:#374151;">Group ID:</label>
      <input type="number" id="groupId" value="14" style="width: 90px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
      <button class="btn-secondary" type="button" onclick="loadGroups()" style="padding: 6px 12px; font-size: 0.85rem;">Показать список групп</button>
    </div>
    <div id="groupsList" style="font-size: 0.85rem; color: #4b5563; margin-bottom: 12px;"></div>

    <div class="pdf-zone" id="dropZone">
      <label for="pdfInput">📄 Выбрать PDF</label>
      <input type="file" id="pdfInput" accept="application/pdf">
      <span class="pdf-filename" id="pdfFilename">Файл не выбран (можно перетащить PDF сюда)</span>
    </div>

    <textarea id="names" placeholder="Эрмырзаева Медина
Абдрусулова Бактыгул
Шарабидин Жалалидин
..."></textarea>

    <div class="row">
      <button class="btn-primary" id="addBtn" onclick="addStudents()">Добавить всех</button>
      <button class="btn-secondary" onclick="document.getElementById('names').value = ''; clearLog()">Очистить</button>
    </div>

    <div id="status"></div>
    <div id="log"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const API_BASE = 'https://mentor-0qlv.onrender.com/api';
    const API_URL = `${API_BASE}/students/`;
    const TOKEN = '050de25fd516c3bc9383692b882ad95357003181';

    function getGroupId() {
      return document.getElementById('groupId').value.trim();
    }

    // Try to fetch the list of groups so you can find the right ID
    // instead of guessing. If the endpoint name/shape differs on the
    // backend, this just shows an error and you can check manually.
    async function loadGroups() {
      const el = document.getElementById('groupsList');
      el.textContent = 'Загружаю список групп...';
      try {
        const res = await fetch(`${API_BASE}/groups/`, {
          headers: {
            'accept': 'application/json, text/plain, */*',
            'authorization': `Token ${TOKEN}`,
            'origin': 'https://mentor-sage.vercel.app',
            'referer': 'https://mentor-sage.vercel.app/'
          }
        });
        if (!res.ok) {
          el.innerHTML = `Не удалось получить список групп (${res.status}). Посмотри ID группы в самом приложении mentor-sage.`;
          return;
        }
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.results || []);
        if (list.length === 0) {
          el.textContent = 'Список групп пуст или формат ответа неожиданный.';
          return;
        }
        el.innerHTML = list
          .map(g => `id ${g.id} — ${g.name || g.title || JSON.stringify(g)}`)
          .join('<br>');
      } catch (e) {
        el.textContent = `Ошибка запроса: ${e.message}. Посмотри ID группы в самом приложении mentor-sage.`;
      }
    }

    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.className = type;
      line.textContent = msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
      document.getElementById('status').textContent = '';
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    // --- PDF handling ---

    const pdfInput = document.getElementById('pdfInput');
    const dropZone = document.getElementById('dropZone');
    const pdfFilename = document.getElementById('pdfFilename');

    pdfInput.addEventListener('change', (e) => {
      if (e.target.files[0]) handlePdfFile(e.target.files[0]);
    });

    ['dragover', 'dragenter'].forEach(evt =>
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.classList.add('drag');
      })
    );
    ['dragleave', 'drop'].forEach(evt =>
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag');
      })
    );
    dropZone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file && file.type === 'application/pdf') handlePdfFile(file);
    });

    async function handlePdfFile(file) {
      pdfFilename.textContent = `Читаю: ${file.name}...`;
      clearLog();
      setStatus('Извлекаю текст из PDF...');

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

        let lines = [];
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const content = await page.getTextContent();

          // Group text items by their vertical (y) position into lines
          const rows = {};
          content.items.forEach(item => {
            const y = Math.round(item.transform[5]);
            if (!rows[y]) rows[y] = [];
            rows[y].push(item.str);
          });

          const pageLines = Object.keys(rows)
            .sort((a, b) => b - a) // top to bottom
            .map(y => rows[y].join(' ').replace(/\s+/g, ' ').trim())
            .filter(l => l.length > 0);

          lines = lines.concat(pageLines);
        }

        const names = cleanNames(lines);

        pdfFilename.textContent = `${file.name} — найдено строк: ${names.length}`;
        document.getElementById('names').value = names.join('\n');
        setStatus(`Извлечено ${names.length} имён из PDF. Проверь список ниже перед отправкой.`);

        if (names.length === 0) {
          log('Не удалось распознать ни одного имени. Возможно, PDF — скан (картинка), а не текст. Вставь список вручную.', 'err');
        }
      } catch (err) {
        pdfFilename.textContent = 'Ошибка чтения PDF';
        setStatus('Не удалось прочитать PDF');
        log(`✗ Ошибка при чтении PDF: ${err.message}`, 'err');
      }
    }

    // Cleanup for both plain name lists and attendance-table style rows
    // (e.g. "Иванов Иван + 700123456 ✅ (10:00-10:30) ✅ (11:00-11:30)").
    // Strategy: keep only the leading run of name words, and cut the line
    // off at the first sign of "extra data" — a digit, a '+', a '(' or a
    // checkmark — since ФИО never contains those.
    function cleanNames(lines) {
      const HEADERS = ['аты-жөнү', 'аты жөнү', 'фио', 'ф.и.о', 'имя', 'список'];

      return lines
        .map(l => l.trim())
        .map(l => l.replace(/^\d+[\.\)]\s*/, '')) // strip leading "1." / "1)"
        .map(l => {
          // cut at the first digit, '+', '(' or ✅ — everything from there
          // on is phone numbers / dates / attendance marks, not the name
          const m = l.match(/[0-9+(✅]/);
          return m ? l.slice(0, m.index) : l;
        })
        .map(l => l.replace(/\s+/g, ' ').trim())
        .filter(l => l.length > 1)
        .filter(l => !/^\d+$/.test(l)) // pure numbers (page numbers etc.)
        .filter(l => /[a-zA-Zа-яА-ЯёЁ]/.test(l)) // must contain letters
        .filter(l => !HEADERS.includes(l.toLowerCase())); // drop table headers
    }

    // --- Submission ---

    async function addStudents() {
      const raw = document.getElementById('names').value;
      const rawLines = raw
        .split('\n')
        .map(s => s.trim())
        .filter(s => s.length > 0);
      const names = cleanNames(rawLines);

      if (names.length === 0) {
        setStatus('Нет имён для добавления');
        return;
      }

      const btn = document.getElementById('addBtn');
      btn.disabled = true;
      clearLog();
      setStatus(`Добавляю ${names.length} учеников...`);

      let ok = 0, fail = 0;
      const group_id = getGroupId();

      for (let i = 0; i < names.length; i++) {
        const full_name = names[i];
        setStatus(`Добавляю ${i + 1} / ${names.length}: ${full_name}`);

        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
              'accept': 'application/json, text/plain, */*',
              'authorization': `Token ${TOKEN}`,
              'content-type': 'application/json',
              'origin': 'https://mentor-sage.vercel.app',
              'referer': 'https://mentor-sage.vercel.app/'
            },
            body: JSON.stringify({ full_name, group_id })
          });

          const data = await res.json().catch(() => ({}));

          if (res.status === 201) {
            log(`✓ ${full_name} → id ${data.id}`, 'ok');
            ok++;
          } else {
            log(`✗ ${full_name} → ${res.status} ${JSON.stringify(data)}`, 'err');
            fail++;
          }
        } catch (e) {
          log(`✗ ${full_name} → ошибка сети: ${e.message}`, 'err');
          fail++;
        }

        // небольшая пауза, чтобы не долбить сервер
        await new Promise(r => setTimeout(r, 300));
      }

      setStatus(`Готово: успешно ${ok}, ошибок ${fail}`);
      btn.disabled = false;
    }
  </script>
</body>
</html>
